<script>
document.addEventListener('DOMContentLoaded', () => {

  const buttons = document.querySelectorAll('.track-btn');
  const lyrics = document.getElementById('lyrics');
  const title = document.getElementById('title-home');
  const logo = document.getElementById('logo-toggle');
  const about = document.getElementById('about');
  const sidebar = document.querySelector('.sidebar');
  const logoFloating = document.querySelector('.logo-floating');
  const backBtn = document.getElementById('mobile-back');
  const albumHero = document.getElementById('album-hero');
const albumLinks = document.getElementById('album-links');
const albumCover = document.querySelector('.album-cover');
  const intro = document.getElementById('intro-overlay');
const introVideo = document.getElementById('intro-video');
  // ===== 모바일에서 앨범커버 위치 이동(타이틀 밑으로) =====
const mobileAlbumSlot = document.getElementById('mobile-album-slot');
const albumHeroOriginalParent = albumHero?.parentElement;
const albumHeroOriginalNext = albumHero?.nextSibling;

function placeAlbumHeroByViewport() {
  if (!albumHero || !mobileAlbumSlot || !albumHeroOriginalParent) return;

  const isMobile = window.innerWidth <= 768;

  if (isMobile) {
    // 타이틀 밑 슬롯으로 이동
    mobileAlbumSlot.appendChild(albumHero);
  } else {
    // 원래 자리(PC)로 복귀
    if (albumHeroOriginalNext) {
      albumHeroOriginalParent.insertBefore(albumHero, albumHeroOriginalNext);
    } else {
      albumHeroOriginalParent.appendChild(albumHero);
    }
  }
}

// 최초 1회 + 화면 회전/리사이즈 대응
placeAlbumHeroByViewport();
window.addEventListener('resize', placeAlbumHeroByViewport);
window.addEventListener('orientationchange', placeAlbumHeroByViewport);


// 영상 끝나면 자동 페이드아웃
if (introVideo) {
  introVideo.addEventListener('ended', () => {
    intro.classList.add('hidden');
  });
}

// 혹시 영상 재생 안되면 4초 후 강제 제거 (안전장치)
setTimeout(() => {
  intro.classList.add('hidden');
}, 4000);


// 커버 클릭 → 링크 토글
if (albumCover) {
  albumCover.addEventListener('click', () => {
    albumLinks.classList.toggle('hidden');
  });
}

// 히어로 숨기기 / 보이기
function hideAlbumHero() {
  if (albumHero) albumHero.style.display = 'none';
}

function showAlbumHero() {
  if (albumHero) albumHero.style.display = '';
}

// 트랙 클릭 시 히어로 숨김
buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    hideAlbumHero();
  });
});

// 타이틀 카드 → 홈 복귀 시 다시 보이게
title.addEventListener('click', () => {
  showAlbumHero();
  albumLinks.classList.add('hidden');
});


  // ===== 모바일 뒤로가기 버튼 =====
  if (backBtn) {
    backBtn.addEventListener('click', () => {
      sidebar.style.display = '';
      if (logoFloating) logoFloating.style.display = '';
      title.style.display = '';
      lyrics.style.display = 'none';
      backBtn.classList.add('hidden');
      
      showAlbumHero();
albumLinks.classList.add('hidden');

    });
  }

  // ===== 트랙 표시 =====
  function showTrack(num) {
    const tpl = document.getElementById('track' + num);
    if (!tpl) return;

    // 설명 닫기
    about.classList.remove('about-visible');
    about.classList.add('about-hidden');

    // 모바일 세로 처리
    if (window.innerWidth <= 768) {
      sidebar.style.display = 'none';
      if (logoFloating) logoFloating.style.display = 'none';
      title.style.display = 'none';
      if (backBtn) backBtn.classList.remove('hidden');
    }

    lyrics.style.display = 'block';
    lyrics.innerHTML = tpl.innerHTML;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // 트랙 버튼 연결
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      showTrack(btn.dataset.track);
    });
  });

  // ===== 타이틀 클릭 → 홈 =====
  title.addEventListener('click', () => {
    lyrics.style.display = 'none';
    lyrics.innerHTML = '';
  });
logo.addEventListener('click', () => {
  const tracklist = document.querySelector('.tracklist');
  const isMobile = window.innerWidth <= 768;
  const isOpen = about.classList.contains('about-visible');

  // ===== 닫기 =====
  if (isOpen) {
    about.classList.remove('about-visible');
    about.classList.add('about-hidden');

    // 모바일 세로일 때만 트랙리스트 복귀
    if (isMobile && tracklist) {
      tracklist.style.display = '';
    }

    return;
  }

  // ===== 열기 =====
  about.classList.remove('about-hidden');
  about.classList.add('about-visible');

  // 모바일 세로일 때만 트랙리스트 숨김
  if (isMobile && tracklist) {
    tracklist.style.display = 'none';
  }
});



});
  </script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, serverTimestamp,
  query, orderBy, onSnapshot, doc, deleteDoc, Timestamp
} from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDzMtqWIo8eq3rYTLA89cHovl5zalNABA",
  authDomain: "chat-8d776.firebaseapp.com",
  projectId: "chat-8d776",
  storageBucket: "chat-8d776.firebasestorage.app",
  messagingSenderId: "29994250404",
  appId: "1:29994250404:web:6cde18f3f08ad6c890b631",
  measurementId: "G-X8VGNNRSQV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== 익명 로그인 (내 댓글만 삭제용) =====
const auth = getAuth(app);
signInAnonymously(auth).catch(console.error);

// ===== 코멘트 폼 토글 =====
const openBtn = document.getElementById("openComment");
const form = document.getElementById("commentForm");
if (openBtn && form) {
  openBtn.onclick = () => {
    const hidden = (form.style.display === "none" || form.style.display === "");
    form.style.display = hidden ? "block" : "none";
  };
}

// ===== DOM =====
const nicknameInput = document.getElementById("nickname");
const commentInput  = document.getElementById("commentInput");
const submitBtn     = document.getElementById("submitComment");
const commentsBox   = document.getElementById("comments");

// 닉네임 저장(로컬)
if (nicknameInput) nicknameInput.value = localStorage.getItem("nickname") || "";

// ===== 스크롤: 평소 숨김 / 마우스 올리면 바로 열기 / 스크롤바도 같이 =====
let sbTimer;
if (commentsBox) {
  // 기본은 닫힘
  commentsBox.style.overflowY = "hidden";

  const openNow = () => {
    commentsBox.style.overflowY = "auto";
    commentsBox.classList.add("show-scrollbar");
    clearTimeout(sbTimer);
  };

  const closeLater = () => {
    clearTimeout(sbTimer);
    sbTimer = setTimeout(() => {
      commentsBox.style.overflowY = "hidden";
      commentsBox.classList.remove("show-scrollbar");
    }, 1000);
  };

  // ✅ 마우스 올리면 바로 열림
  commentsBox.addEventListener("mouseenter", () => {
    openNow();
  });

  // ✅ 마우스 빼면 1초 후 닫힘
  commentsBox.addEventListener("mouseleave", () => {
    closeLater();
  });

  // ✅ 휠 굴리면 첫 휠부터 바로 스크롤 (속도 조절)
  commentsBox.addEventListener("wheel", (e) => {
    openNow();
    e.preventDefault();
    commentsBox.scrollTop += e.deltaY * 0.45; // 느리게/빠르게: 0.35~0.6
    closeLater();
  }, { passive: false });

  // 모바일 터치도 열어주기
  commentsBox.addEventListener("touchstart", openNow, { passive: true });
  commentsBox.addEventListener("touchend", closeLater, { passive: true });
}


// ===== 댓글 작성 =====
if (submitBtn) {
  submitBtn.onclick = async () => {
    const nickname = (nicknameInput?.value.trim() || "익명");
    const text = (commentInput?.value.trim() || "");
    if (!text) return;

    localStorage.setItem("nickname", nickname);

    const user = auth.currentUser;
    if (!user) return;

    await addDoc(collection(db, "comments"), {
      nickname,
      text,
      uid: user.uid,
      created: serverTimestamp()
    });

    commentInput.value = "";
  };
}

function kTime(date) {
  const now = new Date();
  const diffMs = now - date;

  const diffMin = Math.floor(diffMs / 60000);
  const diffHr  = Math.floor(diffMs / 3600000);

  if (diffMin < 1) return "지금";
  if (diffMin < 5) return "방금";
  if (diffMin < 60) return `${diffMin}분 전`;

  // 자정 기준 오늘/어제/그제
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfThat  = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const dayGap = Math.floor((startOfToday - startOfThat) / 86400000);

  if (dayGap === 0) {
    if (diffHr < 6) return `${diffHr}시간 전`;
    return "오늘";
  }
  if (dayGap === 1) return "어제";
  if (dayGap === 2) return "그제";
  if (dayGap < 7) return `${dayGap}일 전`;

  const m = date.getMonth() + 1;
  const d = date.getDate();
  return `${m}/${d}`;
}



// ===== 실시간 렌더 =====
const q = query(collection(db, "comments"), orderBy("created", "desc"));

onAuthStateChanged(auth, () => {
  onSnapshot(q, (snapshot) => {
    commentsBox.innerHTML = "";

    snapshot.forEach((d) => {
      const c = d.data();
      const mine = (auth.currentUser && c.uid === auth.currentUser.uid);

      // 작성시간 텍스트
      let timeText = "";
      if (c.created && typeof c.created.toDate === "function") {
        timeText = kTime(c.created.toDate());
      }

      const div = document.createElement("div");
      div.className = "comment";
      div.innerHTML = `
        <div class="cmt-head">
          <b>${c.nickname || "익명"}</b>

          <span class="cmt-right">
            ${timeText ? `<span class="cmt-time">${timeText}</span>` : ``}
            ${mine ? `<span class="delBtn" data-id="${d.id}">✕</span>` : ``}
          </span>
        </div>

        <div class="cmt-body">${(c.text || "").replaceAll("\n","<br>")}</div>
      `;

      commentsBox.appendChild(div);
    });
  });
});


// ===== 내 댓글 삭제 =====
commentsBox.addEventListener("click", async (e) => {
  const t = e.target;
  if (t.classList.contains("delBtn")) {
    const id = t.dataset.id;
    try {
      await deleteDoc(doc(db, "comments", id));
    } catch (err) {
      console.error(err);
    }
  }
});
</script>
